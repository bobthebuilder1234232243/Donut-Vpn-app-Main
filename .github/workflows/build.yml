name: Build app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android APK
            os: ubuntu-22.04
            target: apk
          - name: Linux DEB and AppImage
            os: ubuntu-22.04
            target: "deb,appimage"
          - name: Windows EXE
            os: windows-latest
            target: exe
          - name: macOS DMG and iOS IPA
            os: macos-latest
            target: "macos,ios"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # ---------------------------------------------------------------------
      # Android
      # ---------------------------------------------------------------------
      - name: Setup Java
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        run: |
          yes | flutter doctor --android-licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null || true

      - name: Prepare Android
        if: matrix.target == 'apk'
        run: make android-apk-prepare

      - name: Upload Android core
        if: matrix.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-core-android
          path: android/app/libs/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Decode Keystore and Create key.properties
        if: matrix.target == 'apk'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore
          echo "storePassword=${{ secrets.STORE_PASS }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASS }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties

      - name: Build Android APK
        if: matrix.target == 'apk'
        run: flutter build apk --release

      - name: Verify Android APK architectures
        if: matrix.target == 'apk'
        run: |
          set -e
          echo "--- Verifying Android APK Architectures ---"
          APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" -print -quit)
          test -n "$APK_PATH"
          unzip -l "$APK_PATH" | grep "lib/" | grep "libdonut-core.so"
          # Verify x86_64 (Chromebook) exists
          unzip -l "$APK_PATH" | grep "lib/x86_64/libdonut-core.so" || (echo "FAIL: x86_64 core missing!" && exit 1)
          # Verify arm64-v8a (Phones) exists
          unzip -l "$APK_PATH" | grep "lib/arm64-v8a/libdonut-core.so" || (echo "FAIL: arm64-v8a core missing!" && exit 1)

      - name: Upload Android APK
        if: matrix.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # Linux
      # ---------------------------------------------------------------------
      - name: Install Linux dependencies
        if: contains(matrix.target, 'deb')
        run: make linux-amd64-install-deps

      - name: Prepare Linux
        if: contains(matrix.target, 'deb')
        run: make linux-amd64-prepare

      - name: Upload Linux core
        if: contains(matrix.target, 'deb')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-core-linux
          path: donutvpn-core/bin/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Build Linux packages
        if: contains(matrix.target, 'deb')
        env:
          CXXFLAGS: "-Wno-error=deprecated-declarations"
        run: make linux-amd64-release

      - name: Smoke test Linux AppImage
        if: contains(matrix.target, 'deb')
        run: |
          sudo apt-get install -y xvfb
          APPIMAGE="dist/4.1.4+40104/DonutVpn.AppImage"
          test -f "$APPIMAGE"
          chmod +x "$APPIMAGE"
          xvfb-run -a "$APPIMAGE" > linux-smoke-test.log 2>&1 &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID"; then
            echo "Linux App is running"
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "Linux App crashed"
            cat linux-smoke-test.log
            exit 1
          fi

      - name: Upload Linux smoke test log
        if: always() && contains(matrix.target, 'deb')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-linux-smoke-test-log
          path: linux-smoke-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux packages
        if: contains(matrix.target, 'deb')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-linux
          path: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # Windows
      # ---------------------------------------------------------------------
      - name: Install Windows build tools
        if: matrix.target == 'exe'
        shell: bash
        run: |
          choco install make innosetup -y --no-progress
          dart pub global activate fastforge

      - name: Prepare Windows
        if: matrix.target == 'exe'
        shell: bash
        run: make windows-prepare

      - name: Upload Windows core
        if: matrix.target == 'exe'
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-core-windows
          path: donutvpn-core/bin/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows EXE
        if: matrix.target == 'exe'
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export PATH="$PATH:$(cygpath -u "${APPDATA:-$HOME/AppData/Roaming}")/Pub/Cache/bin"
          dart pub global activate fastforge
          make windows-exe-release

      - name: Smoke test Windows app
        if: matrix.target == 'exe'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # fastforge's "exe" target is an Inno Setup installer; smoke-test the
          # compiled app from the release bundle instead of the setup wizard.
          $appPath = (Resolve-Path "build\windows\x64\runner\Release\DonutVpn.exe").Path
          $appDir = Split-Path -Parent $appPath

          New-Item -ItemType File -Force -Path "windows-smoke-test.log", "windows-error.log" | Out-Null
          $proc = Start-Process -FilePath $appPath `
            -WorkingDirectory $appDir `
            -RedirectStandardOutput "windows-smoke-test.log" `
            -RedirectStandardError "windows-error.log" `
            -PassThru
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            Write-Error "Windows App crashed" -ErrorAction Continue
            Get-Content "windows-smoke-test.log", "windows-error.log"
            exit 1
          } else {
            Write-Host "Windows App is running"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows smoke test logs
        if: always() && matrix.target == 'exe'
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-windows-smoke-test-logs
          path: |
            windows-smoke-test.log
            windows-error.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows EXE
        if: matrix.target == 'exe'
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-windows
          path: dist/**/*.exe
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # macOS
      # ---------------------------------------------------------------------
      - name: Prepare macOS
        if: contains(matrix.target, 'macos')
        run: make macos-prepare

      - name: Upload macOS core
        if: contains(matrix.target, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-core-macos
          path: donutvpn-core/bin/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS
        if: contains(matrix.target, 'macos')
        run: flutter build macos --release

      - name: Package macOS DMG
        if: contains(matrix.target, 'macos')
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          hdiutil create -volname "DonutVpn" -srcfolder "$APP_PATH" -ov -format UDZO Donut-Vpn-macOS.dmg

      - name: Verify macOS DMG architectures
        if: contains(matrix.target, 'macos')
        run: |
          set -euo pipefail
          echo "--- Verifying macOS DMG ---"
          hdiutil attach Donut-Vpn-macOS.dmg
          trap 'hdiutil detach "/Volumes/DonutVpn" >/dev/null 2>&1 || true' EXIT
          CORE_DYLIB=$(find "/Volumes/DonutVpn/Donut VPN.app" -name "donut-core.dylib" -print -quit)
          test -n "$CORE_DYLIB"
          CORE_ARCHS=$(lipo -info "$CORE_DYLIB")
          echo "$CORE_ARCHS"
          echo "$CORE_ARCHS" | grep -q "x86_64" || (echo "FAIL: x86_64 macOS core missing!" && exit 1)
          echo "$CORE_ARCHS" | grep -q "arm64" || (echo "FAIL: arm64 macOS core missing!" && exit 1)

      - name: Upload macOS DMG
        if: contains(matrix.target, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-macos
          path: Donut-Vpn-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # iOS (unsigned; macOS runner)
      # ---------------------------------------------------------------------
      - name: Prepare iOS Core
        if: contains(matrix.target, 'ios')
        run: make ios-prepare

      - name: Clean iOS Build Environment
        if: contains(matrix.target, 'ios')
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Runner.xcworkspace

      - name: Install iOS Dependencies
        if: contains(matrix.target, 'ios')
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Verify Build Provenance Markers
        if: contains(matrix.target, 'ios')
        run: |
          set -euo pipefail
          # The provenance banner is the only way to tell a fresh IPA from a stale one
          # on device: grep the syslog for "[DonutVPN] PROVENANCE" after installing.
          grep -q "PROVENANCE" lib/bootstrap.dart || (echo "FAIL: provenance banner missing from bootstrap" && exit 1)
          grep -q "ports=17078/17079" lib/bootstrap.dart || (echo "FAIL: provenance port list missing" && exit 1)
          grep -q "PROVENANCE" ios/Runner/AppDelegate.swift || (echo "FAIL: provenance NSLog missing from AppDelegate" && exit 1)
          grep -q "portFront = 17078" lib/donutcore/core_interface/core_interface_mobile.dart || (echo "FAIL: portFront drifted" && exit 1)
          grep -q "portBack = 17079" lib/donutcore/core_interface/core_interface_mobile.dart || (echo "FAIL: portBack drifted" && exit 1)
          echo "--- provenance string compiled into this artifact ---"
          grep -A2 "PROVENANCE" lib/bootstrap.dart
          grep "PROVENANCE" ios/Runner/AppDelegate.swift
          echo "--- core ports ---"
          grep "portFront = \|portBack = " lib/donutcore/core_interface/core_interface_mobile.dart
          echo "OK: provenance markers and port constants are in the tree"

      - name: Generate App Icons
        if: contains(matrix.target, 'ios')
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/donut-icons.stamp"
          dart run flutter_launcher_icons 2>&1 | tee "$RUNNER_TEMP/flutter_launcher_icons.log"

      - name: Verify iOS App Icons Were Regenerated
        if: contains(matrix.target, 'ios')
        run: |
          set -euo pipefail
          ICON_DIR=ios/Runner/Assets.xcassets/AppIcon.appiconset
          STAMP="$RUNNER_TEMP/donut-icons.stamp"
          LOG="$RUNNER_TEMP/flutter_launcher_icons.log"

          echo "--- Icon source ---"
          ls -l assets/images/donut_logo.png
          test -s assets/images/donut_logo.png
          test -s "$ICON_DIR/Contents.json"

          echo "--- AppIcon PNGs written since generation started ---"
          REGENERATED=$(find "$ICON_DIR" -name '*.png' -newer "$STAMP" -print)
          echo "$REGENERATED"

          if [ -z "$REGENERATED" ]; then
            echo "FAIL: icons not regenerated - no PNG in $ICON_DIR is newer than $STAMP"
            echo "--- flutter_launcher_icons output ---"
            cat "$LOG" || true
            exit 1
          fi

          COUNT=$(printf '%s\n' "$REGENERATED" | wc -l | tr -d ' ')
          TOTAL=$(find "$ICON_DIR" -name '*.png' | wc -l | tr -d ' ')
          echo "OK: $COUNT/$TOTAL AppIcon PNGs regenerated in this run"

          echo "--- Icon root-cause guards ---"
          # An Icon Composer bundle in the target overrides AppIcon.appiconset, so
          # regenerating the catalog proves nothing while this file exists.
          if [ -e ios/Runner/AppIcon.icon ]; then
            echo "FAIL: ios/Runner/AppIcon.icon is present - it overrides AppIcon.appiconset"
            exit 1
          fi
          if grep -q "ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon" ios/Runner.xcodeproj/project.pbxproj; then
            echo "FAIL: ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS must be YES, not AppIcon"
            exit 1
          fi
          APPICON_NAME_COUNT=$(grep -c "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" ios/Runner.xcodeproj/project.pbxproj)
          if [ "$APPICON_NAME_COUNT" -lt 3 ]; then
            echo "FAIL: ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon found in only $APPICON_NAME_COUNT config(s)"
            exit 1
          fi
          echo "OK: icon root-cause guards passed ($APPICON_NAME_COUNT configs name AppIcon)"

      - name: Upload iOS core
        if: always() && contains(matrix.target, 'ios')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-core-ios
          path: ios/Frameworks/DonutCore.xcframework/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Build unsigned iOS app
        if: contains(matrix.target, 'ios')
        run: flutter build ios --release --no-codesign

      - name: Verify Packaged App Icon
        if: contains(matrix.target, 'ios')
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || (echo "FAIL: $APP not found" && exit 1)
          test -f "$APP/Assets.car" || (echo "FAIL: Assets.car missing from the packaged app" && exit 1)
          if [ -e "$APP/AppIcon.icon" ]; then
            echo "FAIL: AppIcon.icon was copied into the packaged app and overrides the catalog"
            exit 1
          fi
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets.json"
          if ! grep -q '"Name" : "AppIcon"' "$RUNNER_TEMP/assets.json"; then
            echo "FAIL: no AppIcon renditions in the packaged Assets.car"
            head -40 "$RUNNER_TEMP/assets.json" || true
            exit 1
          fi
          echo "OK: packaged Assets.car contains AppIcon renditions"

      - name: Package Unsigned IPA
        if: always() && contains(matrix.target, 'ios')
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing build/ios directory:"
          ls -R build/ios || echo "build/ios does not exist"

          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Fallback: looking for any .app directory"
            APP_PATH=$(find build/ios -name "*.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r Donut-Vpn-iOS-unsigned.ipa Payload
          else
            echo "No .app found anywhere in build/ios"
            exit 1
          fi

      - name: Verify iOS IPA architectures
        if: contains(matrix.target, 'ios')
        run: |
          set -euo pipefail
          echo "--- Verifying iOS IPA ---"
          rm -rf temp_ipa
          unzip -q Donut-Vpn-iOS-unsigned.ipa -d temp_ipa

          CORE_IN_IPA=temp_ipa/Payload/Runner.app/Frameworks/DonutCore.framework/DonutCore
          if [ -f "$CORE_IN_IPA" ]; then
            echo "Found embedded DonutCore framework"
            CORE_ARCHS=$(lipo -info "$CORE_IN_IPA")
          else
            echo "DonutCore is statically linked; checking the arm64 core slice and Runner binary"
            CORE_IN_IPA=ios/Frameworks/DonutCore.xcframework/ios-arm64/DonutCore.framework/DonutCore
            test -f "$CORE_IN_IPA"
            CORE_ARCHS=$(lipo -info "$CORE_IN_IPA")
          fi
          echo "$CORE_ARCHS"
          echo "$CORE_ARCHS" | grep -q "arm64" || (echo "FAIL: arm64 core missing in iOS!" && exit 1)

          RUNNER=temp_ipa/Payload/Runner.app/Runner
          test -f "$RUNNER"
          RUNNER_ARCHS=$(lipo -info "$RUNNER")
          echo "$RUNNER_ARCHS"
          echo "$RUNNER_ARCHS" | grep -q "arm64" || (echo "FAIL: arm64 Runner binary missing!" && exit 1)
          rm -rf temp_ipa

      - name: Upload iOS IPA
        if: always() && contains(matrix.target, 'ios')
        uses: actions/upload-artifact@v4
        with:
          name: donut-vpn-ios-ipa
          path: Donut-Vpn-iOS-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

  update-draft:
    name: Update draft release
    permissions:
      contents: write
    if: ${{ inputs.upload-artifact }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out
          merge-multiple: true

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/*
          name: 'draft'
          tag_name: 'draft'
          prerelease: true
